name: Hosted Draft pump effect

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Exact GitHub issue number sealed by the collector
        required: true
        type: number
      work-key:
        description: Exact sealed Draft work key
        required: true
        type: string
      operation-id:
        description: Exact durable operation identity
        required: true
        type: string
      committed-revision:
        description: Expected durable ledger revision
        required: true
        type: string
      ledger-root-oid:
        description: Trusted ledger registry root Git object ID
        required: true
        type: string
      ledger-root-revision:
        description: Trusted ledger registry root content revision
        required: true
        type: string
  workflow_call:
    inputs:
      issue-number:
        description: Exact GitHub issue number sealed by the collector
        required: true
        type: number
      work-key:
        description: Exact sealed Draft work key
        required: true
        type: string
      operation-id:
        description: Exact durable operation identity
        required: true
        type: string
      committed-revision:
        description: Expected durable ledger revision
        required: true
        type: string
      ledger-root-oid:
        description: Trusted ledger registry root Git object ID
        required: true
        type: string
      ledger-root-revision:
        description: Trusted ledger registry root content revision
        required: true
        type: string
    secrets:
      GAIA_PUMP_APP_PRIVATE_KEY:
        description: Private key for the dedicated, bounded Gaia pump GitHub App
        required: true

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ format('gaia-draft-{0}', inputs['work-key']) }}
  cancel-in-progress: false

jobs:
  reconcile-effect:
    name: Reconcile one sealed Draft effect
    runs-on: windows-latest
    steps:
      - name: Require the dedicated pump identity
        shell: pwsh
        env:
          GAIA_PUMP_APP_ID: ${{ vars.GAIA_PUMP_APP_ID }}
          GAIA_PUMP_APP_PRIVATE_KEY: ${{ secrets.GAIA_PUMP_APP_PRIVATE_KEY }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_REPOSITORY_NODE_ID: ${{ vars.GAIA_REPOSITORY_NODE_ID }}
        run: |
          $required = @(
            $env:GAIA_PUMP_APP_ID,
            $env:GAIA_PUMP_APP_PRIVATE_KEY,
            $env:GAIA_PUMP_ACTOR_ID,
            $env:GAIA_REPOSITORY_NODE_ID
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
            throw 'Dedicated Gaia pump identity is not configured.'
          }

      - name: Mint a bounded pump App token
        id: pump-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GAIA_PUMP_APP_ID }}
          private-key: ${{ secrets.GAIA_PUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the sealed executor revision
        uses: actions/checkout@v7
        with:
          token: ${{ steps.pump-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Reconcile the sealed effect once
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.pump-token.outputs.token }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_REPOSITORY_NODE_ID: ${{ vars.GAIA_REPOSITORY_NODE_ID }}
          GAIA_VERIFIED_CONCURRENCY_GROUP: ${{ format('gaia-draft-{0}', inputs['work-key']) }}
          GAIA_WORK_KEY: ${{ inputs['work-key'] }}
          GAIA_OPERATION_ID: ${{ inputs['operation-id'] }}
          GAIA_EXPECTED_REVISION: ${{ inputs['committed-revision'] }}
          GAIA_LEDGER_ROOT_OID: ${{ inputs['ledger-root-oid'] }}
          GAIA_LEDGER_ROOT_REVISION: ${{ inputs['ledger-root-revision'] }}
          GAIA_DRAFT_TITLE: ${{ format('draft: deliver issue #{0}', inputs['issue-number']) }}
          GAIA_ISSUE_URL: ${{ format('{0}/{1}/issues/{2}', github.server_url, github.repository, inputs['issue-number']) }}
          GAIA_DRAFT_OWNER: Gaia hosted Draft pump
          GAIA_DRAFT_GATE: DELIVERY
          GAIA_CHECKLIST_JSON: '["Create or reuse one exact Draft pull request","Persist one terminal receipt"]'
          GAIA_ETA_MINUTES: '60:120'
          GAIA_RECEIPT_PATH: ${{ runner.temp }}/gaia-hosted-draft-pump-receipt.json
          GAIA_ERROR_PATH: ${{ runner.temp }}/gaia-hosted-draft-pump-error.json
        run: |
          & node scripts/hosted-draft-pump.mjs reconcile `
            --repository $env:GITHUB_REPOSITORY `
            --pump-actor-id $env:GAIA_PUMP_ACTOR_ID `
            --repository-node-id $env:GAIA_REPOSITORY_NODE_ID `
            --work-key $env:GAIA_WORK_KEY `
            --operation-id $env:GAIA_OPERATION_ID `
            --expected-revision $env:GAIA_EXPECTED_REVISION `
            --ledger-root-oid $env:GAIA_LEDGER_ROOT_OID `
            --ledger-root-revision $env:GAIA_LEDGER_ROOT_REVISION `
            1> $env:GAIA_RECEIPT_PATH 2> $env:GAIA_ERROR_PATH
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Move-Item -LiteralPath $env:GAIA_ERROR_PATH -Destination $env:GAIA_RECEIPT_PATH -Force
            exit $exitCode
          }

      - name: Upload the closed reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-hosted-draft-pump-receipt
          path: ${{ runner.temp }}/gaia-hosted-draft-pump-receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
