name: Hosted Draft intake

on:
  workflow_dispatch:
    inputs:
      one_canary:
        description: Select the single reviewed canary policy from the sealed checkout
        type: boolean
        default: false
      normal_policy:
        description: Select the repository-scoped normal admission policy from the sealed checkout
        type: boolean
        default: false
      prepare_issue:
        description: Prepare one ready issue in the ledger only; no Draft or agent execution
        type: string
        default: ''
      target_issue:
        description: Restrict a manual normal-policy run to exactly one issue number; empty keeps the repository-wide funnel
        type: string
        default: ''
      readmit_operation:
        description: Re-admit one effect-free refused operation (its operation id); no Draft, provider call or admission
        type: string
        default: ''
      readmit_revision:
        description: The refused operation's current committed revision, as the operator read it
        type: string
        default: ''
      readmit_reason:
        description: Why this refusal may be followed by another admission; recorded in the ledger
        type: string
        default: ''
      readmit_apply:
        description: Write the successor admission; unchecked is a dry run that writes nothing
        type: boolean
        default: false
      settle_operation:
        description: Settle one EFFECT_AMBIGUOUS operation (its operation id) from a read-only marker search; no Draft, retry or cancellation
        type: string
        default: ''
      settle_revision:
        description: The ambiguous operation's current committed revision, as the operator read it
        type: string
        default: ''
      settle_reason:
        description: Why this ambiguous operation is being settled; recorded in the ledger with the evidence
        type: string
        default: ''
      settle_apply:
        description: Write ABANDONED when the executor run has completed and the search then finds no pull request; unchecked is a dry run that writes nothing
        type: boolean
        default: false
  issues:
    types: [labeled]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'issues' && format('gaia-draft-intake-issue-{0}', github.event.issue.number) || 'gaia-draft-intake-recovery' }}
  cancel-in-progress: false

jobs:
  intake:
    name: Admit or resume one hosted Draft operation
    if: github.event_name != 'issues' || github.event.label.name == 'ready-for-agent'
    runs-on: windows-latest
    steps:
      - name: Require the dedicated pump identity
        id: identity
        shell: pwsh
        env:
          GAIA_PUMP_APP_ID: ${{ vars.GAIA_PUMP_APP_ID }}
          GAIA_PUMP_APP_PRIVATE_KEY: ${{ secrets.GAIA_PUMP_APP_PRIVATE_KEY }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_REPOSITORY_NODE_ID: ${{ vars.GAIA_REPOSITORY_NODE_ID }}
          GAIA_MANAGED_ROUND_JSON: ${{ vars.GAIA_MANAGED_ROUND_JSON }}
          GAIA_ONE_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.one_canary }}
          GAIA_PREPARE_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_issue || '' }}
          GAIA_NORMAL_POLICY_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.normal_policy }}
          GAIA_NORMAL_POLICY_VAR: ${{ github.event_name != 'workflow_dispatch' && vars.GAIA_NORMAL_POLICY_ENABLED == 'true' }}
          GAIA_TARGET_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || '' }}
          GAIA_READMIT_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.readmit_operation || '' }}
          GAIA_READMIT_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.readmit_revision || '' }}
          GAIA_READMIT_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.readmit_reason || '' }}
          GAIA_READMIT_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.readmit_apply }}
          GAIA_SETTLE_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.settle_operation || '' }}
          GAIA_SETTLE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.settle_revision || '' }}
          GAIA_SETTLE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.settle_reason || '' }}
          GAIA_SETTLE_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.settle_apply }}
        run: |
          # Normal selection is computed once, here, and published as this step's only output so
          # every later step reads the same decision instead of re-deriving it from inputs/vars.
          $normalSelected = ($env:GAIA_NORMAL_POLICY_DISPATCH -eq 'true') -or ($env:GAIA_NORMAL_POLICY_VAR -eq 'true')
          if ($env:GAIA_ONE_CANARY -eq 'true' -and $normalSelected) {
            throw 'Canary and normal admission are mutually exclusive.'
          }
          if ($env:GAIA_ONE_CANARY -eq 'true' -and $env:GAIA_PREPARE_ISSUE) {
            throw 'Preparation and canary execution are mutually exclusive.'
          }
          if ($normalSelected -and $env:GAIA_PREPARE_ISSUE) {
            throw 'Preparation and normal admission execution are mutually exclusive.'
          }
          # An issue selector is scheduling data, not authority: it only narrows which issue this
          # run may act on, and the policy, identity and ledger gates below and downstream are
          # untouched by it. It is validated here, in the step that runs before the App token is
          # minted and before anything reads the ledger, so a malformed or incompatible selection
          # never reaches a token, a policy file or an effect. Syntax first, so a selector is
          # always a positive safe integer before anything is decided about it; the 16-digit bound
          # keeps the cast below inside Int64 and the explicit comparison keeps it inside the
          # JavaScript safe range the CLI re-checks. Only a value of that shape is ever written to
          # GITHUB_OUTPUT, which is what stops a newline in the input forging a second output line.
          $target = $env:GAIA_TARGET_ISSUE
          if ($target) {
            if ($target -cnotmatch '^[1-9][0-9]{0,15}\z' -or [long]$target -gt 9007199254740991) {
              throw 'An issue selector must be one positive issue number.'
            }
            if ($env:GAIA_NORMAL_POLICY_DISPATCH -ne 'true') {
              throw 'An issue selector is accepted only on a manual normal-policy run.'
            }
            if ($env:GAIA_ONE_CANARY -eq 'true' -or $env:GAIA_PREPARE_ISSUE) {
              throw 'An issue selector is incompatible with canary execution and preparation.'
            }
          }
          # A re-admission is an operator decision about one refused operation, so it runs alone:
          # no canary, no normal admission, no preparation and no issue selector beside it. Both
          # identifiers are checked for shape here, before any token exists; eligibility, the
          # expected revision and the reason are re-checked against the ledger by the CLI. Ticking
          # apply alone is a mistaken re-admission, never a request for an ordinary intake run.
          $readmit = [bool]$env:GAIA_READMIT_OPERATION
          if ($readmit -or $env:GAIA_READMIT_REVISION -or $env:GAIA_READMIT_REASON -or $env:GAIA_READMIT_APPLY -eq 'true') {
            if (!$readmit -or !$env:GAIA_READMIT_REVISION -or [string]::IsNullOrWhiteSpace($env:GAIA_READMIT_REASON)) {
              throw 'A re-admission names one operation, its revision and a written reason.'
            }
            if ($env:GAIA_READMIT_OPERATION -cnotmatch '^[a-f0-9]{64}\z' -or $env:GAIA_READMIT_REVISION -cnotmatch '^[a-f0-9]{64}\z') {
              throw 'A re-admission names an operation id and a committed revision.'
            }
            if ($env:GAIA_ONE_CANARY -eq 'true' -or $normalSelected -or $env:GAIA_PREPARE_ISSUE -or $target) {
              throw 'A re-admission runs alone.'
            }
          }
          # A settlement is the same kind of operator decision, about one ambiguous operation, and
          # runs alone in the same way, beside no re-admission either. Shapes are checked here; the
          # CLI re-reads the operation at that revision, reads its executor's run attempt and runs
          # the marker search itself, and writes only an absence found after that attempt ended.
          # Ticking apply alone is a mistaken settlement, never an intake run.
          $settle = [bool]$env:GAIA_SETTLE_OPERATION
          if ($settle -or $env:GAIA_SETTLE_REVISION -or $env:GAIA_SETTLE_REASON -or $env:GAIA_SETTLE_APPLY -eq 'true') {
            if (!$settle -or !$env:GAIA_SETTLE_REVISION -or [string]::IsNullOrWhiteSpace($env:GAIA_SETTLE_REASON)) {
              throw 'A settlement names one operation, its revision and a written reason.'
            }
            if ($env:GAIA_SETTLE_OPERATION -cnotmatch '^[a-f0-9]{64}\z' -or $env:GAIA_SETTLE_REVISION -cnotmatch '^[a-f0-9]{64}\z') {
              throw 'A settlement names an operation id and a committed revision.'
            }
            if ($env:GAIA_ONE_CANARY -eq 'true' -or $normalSelected -or $env:GAIA_PREPARE_ISSUE -or $target -or $readmit) {
              throw 'A settlement runs alone.'
            }
          }
          $required = @(
            $env:GAIA_PUMP_APP_ID,
            $env:GAIA_PUMP_APP_PRIVATE_KEY,
            $env:GAIA_PUMP_ACTOR_ID,
            $env:GAIA_REPOSITORY_NODE_ID
          )
          if ($env:GAIA_ONE_CANARY -ne 'true' -and !$normalSelected -and !$env:GAIA_PREPARE_ISSUE -and !$readmit -and !$settle) {
            $required += $env:GAIA_MANAGED_ROUND_JSON
          }
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
            throw 'Dedicated Gaia pump identity is not configured.'
          }
          "normal_policy=$(if ($normalSelected) { 'true' } else { 'false' })" | Out-File $env:GITHUB_OUTPUT -Append
          "target_issue=$target" | Out-File $env:GITHUB_OUTPUT -Append
          "readmit=$(if ($readmit) { 'true' } else { 'false' })" | Out-File $env:GITHUB_OUTPUT -Append
          "settle=$(if ($settle) { 'true' } else { 'false' })" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Mint a bounded pump App token
        id: pump-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GAIA_PUMP_APP_ID }}
          private-key: ${{ secrets.GAIA_PUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the sealed intake revision
        uses: actions/checkout@v7
        with:
          token: ${{ steps.pump-token.outputs.token }}
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Read the trusted ledger registry root
        id: policy
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath '.github/gaia/pump-policy.json' -Raw | ConvertFrom-Json
          "oid=$($policy.ledgerRegistryRootOid)" | Out-File $env:GITHUB_OUTPUT -Append
          "revision=$($policy.ledgerRegistryRootRevision)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Freshen the normal-admission policy window
        # The checked-in file pins identity (repository, owners, reviewers), never a live
        # window: a static validFrom/validUntil could not outlive the gap between scheduled
        # runs (max 1h, cron every 6h), so every run re-anchors the window to its own start
        # instead of trusting whatever was last committed. This rewrites the sealed checkout's
        # own copy in place, in the ephemeral runner workspace only — nothing is pushed, and
        # the path bound below stays the one sealed literal; only its runtime content changes.
        if: steps.identity.outputs.normal_policy == 'true'
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath '.github/gaia/normal-policy.json' -Raw | ConvertFrom-Json
          $from = (Get-Date).ToUniversalTime()
          $until = $from.AddMinutes(15)
          $policy.validFrom = $from.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $policy.validUntil = $until.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $policy | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath '.github/gaia/normal-policy.json'

      - name: Prepare one operation without a Draft effect
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.pump-token.outputs.token }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_ISSUE_NUMBER: ${{ inputs.prepare_issue }}
          GAIA_LEDGER_ROOT_OID: ${{ steps.policy.outputs.oid }}
          GAIA_LEDGER_ROOT_REVISION: ${{ steps.policy.outputs.revision }}
          GAIA_RECEIPT_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-receipt.json
          GAIA_ERROR_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-error.json
        run: |
          & node scripts/hosted-draft-pump.mjs enqueue `
            --repository $env:GITHUB_REPOSITORY `
            --pump-actor-id $env:GAIA_PUMP_ACTOR_ID `
            --ledger-root-oid $env:GAIA_LEDGER_ROOT_OID `
            --ledger-root-revision $env:GAIA_LEDGER_ROOT_REVISION `
            --issue $env:GAIA_ISSUE_NUMBER `
            1> $env:GAIA_RECEIPT_PATH 2> $env:GAIA_ERROR_PATH
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Move-Item -LiteralPath $env:GAIA_ERROR_PATH -Destination $env:GAIA_RECEIPT_PATH -Force
            exit $exitCode
          }

      - name: Re-admit one effect-free refusal
        # Operator authority only: a manual dispatch naming one refused operation, and nothing
        # else, reaches this step. It opens a successor admission (a dry run unless readmit_apply)
        # and never admits work, calls a provider or publishes an observation. The reason reaches
        # the CLI through env:, never interpolated into the script.
        if: steps.identity.outputs.readmit == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.pump-token.outputs.token }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_LEDGER_ROOT_OID: ${{ steps.policy.outputs.oid }}
          GAIA_LEDGER_ROOT_REVISION: ${{ steps.policy.outputs.revision }}
          GAIA_READMIT_OPERATION: ${{ inputs.readmit_operation }}
          GAIA_READMIT_REVISION: ${{ inputs.readmit_revision }}
          GAIA_READMIT_REASON: ${{ inputs.readmit_reason }}
          GAIA_READMIT_APPLY: ${{ inputs.readmit_apply }}
          GAIA_RECEIPT_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-receipt.json
          GAIA_ERROR_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-error.json
        run: |
          & node scripts/hosted-draft-pump.mjs readmit `
            --repository $env:GITHUB_REPOSITORY `
            --pump-actor-id $env:GAIA_PUMP_ACTOR_ID `
            --ledger-root-oid $env:GAIA_LEDGER_ROOT_OID `
            --ledger-root-revision $env:GAIA_LEDGER_ROOT_REVISION `
            1> $env:GAIA_RECEIPT_PATH 2> $env:GAIA_ERROR_PATH
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Move-Item -LiteralPath $env:GAIA_ERROR_PATH -Destination $env:GAIA_RECEIPT_PATH -Force
            exit $exitCode
          }
          # A refused re-admission is a legitimate, typed outcome, so the CLI reports it with exit 0
          # and the receipt is kept for upload. The run itself still fails, so an operator sees the
          # refusal on the run rather than only inside the artifact.
          $kind = (Get-Content -Raw -LiteralPath $env:GAIA_RECEIPT_PATH | ConvertFrom-Json).result.kind
          if ($kind -cnotin @('ReadmissionPlanned', 'Readmitted', 'AlreadyReadmitted')) {
            throw "The re-admission was refused: $kind. The uploaded receipt names the refusal."
          }

      - name: Settle one ambiguous Draft operation
        # Operator authority only: a manual dispatch naming one EFFECT_AMBIGUOUS operation, and
        # nothing else, reaches this step. It re-reads the operation at the named revision, reads
        # the run attempt that wrote its EFFECT_STARTED and searches its marker, both read-only, and
        # writes ABANDONED only when that attempt has completed, a search begun 65 minutes or more
        # after its last update finds no pull request, and settle_apply is ticked. It never creates, retries or
        # cancels an effect and publishes no observation. The reason reaches the CLI through env:,
        # never interpolated into the script.
        if: steps.identity.outputs.settle == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.pump-token.outputs.token }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_REPOSITORY_NODE_ID: ${{ vars.GAIA_REPOSITORY_NODE_ID }}
          GAIA_LEDGER_ROOT_OID: ${{ steps.policy.outputs.oid }}
          GAIA_LEDGER_ROOT_REVISION: ${{ steps.policy.outputs.revision }}
          GAIA_SETTLE_OPERATION: ${{ inputs.settle_operation }}
          GAIA_SETTLE_REVISION: ${{ inputs.settle_revision }}
          GAIA_SETTLE_REASON: ${{ inputs.settle_reason }}
          GAIA_SETTLE_APPLY: ${{ inputs.settle_apply }}
          GAIA_RECEIPT_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-receipt.json
          GAIA_ERROR_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-error.json
        run: |
          & node scripts/hosted-draft-pump.mjs settle `
            --repository $env:GITHUB_REPOSITORY `
            --pump-actor-id $env:GAIA_PUMP_ACTOR_ID `
            --repository-node-id $env:GAIA_REPOSITORY_NODE_ID `
            --ledger-root-oid $env:GAIA_LEDGER_ROOT_OID `
            --ledger-root-revision $env:GAIA_LEDGER_ROOT_REVISION `
            1> $env:GAIA_RECEIPT_PATH 2> $env:GAIA_ERROR_PATH
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Move-Item -LiteralPath $env:GAIA_ERROR_PATH -Destination $env:GAIA_RECEIPT_PATH -Force
            exit $exitCode
          }
          # Only a planned or written abandonment is what this dispatch asks for. Every other typed
          # outcome (a Draft found for reconcile to adopt, a search that proves nothing, an executor
          # not yet finished, an operation that moved or is not ambiguous) exits 0 with its receipt
          # kept for upload, and fails the run so the operator sees it on the run rather than only
          # inside the artifact.
          $kind = (Get-Content -Raw -LiteralPath $env:GAIA_RECEIPT_PATH | ConvertFrom-Json).result.kind
          if ($kind -cnotin @('AbandonmentPlanned', 'Abandoned', 'AlreadyAbandoned')) {
            throw "The settlement was not made: $kind. The uploaded receipt names why."
          }

      - name: Resume or admit exactly one Draft operation
        if: steps.identity.outputs.readmit != 'true' && steps.identity.outputs.settle != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.prepare_issue)
        shell: pwsh
        # GAIA_OBSERVATION_PATH below is empty for a labeled issue run, which the CLI reads as an
        # absent value. `sequence` on a published reading is the Actions run id, and run ids
        # execute in order only within one concurrency group; the group above partitions labeled
        # runs per issue, so two lanes can finish out of run-id order and the later one's reading
        # would be refused as IncoherentHostedDraftPump against real forward progress. The ordered
        # reading therefore keeps one writer: the single non-cancelling recovery group. The truthy
        # branch is first because Actions collapses `A && '' || B` to `B`.
        env:
          GH_TOKEN: ${{ steps.pump-token.outputs.token }}
          GAIA_PUMP_ACTOR_ID: ${{ vars.GAIA_PUMP_ACTOR_ID }}
          GAIA_REPOSITORY_NODE_ID: ${{ vars.GAIA_REPOSITORY_NODE_ID }}
          GAIA_MANAGED_ROUND_JSON: ${{ vars.GAIA_MANAGED_ROUND_JSON }}
          GAIA_ISSUE_NUMBER: ${{ steps.identity.outputs.target_issue || github.event.issue.number }}
          GAIA_CANARY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.one_canary && '.github/gaia/canary-policy.json' || '' }}
          GAIA_NORMAL_POLICY: ${{ steps.identity.outputs.normal_policy == 'true' && '.github/gaia/normal-policy.json' || '' }}
          GAIA_LEDGER_ROOT_OID: ${{ steps.policy.outputs.oid }}
          GAIA_LEDGER_ROOT_REVISION: ${{ steps.policy.outputs.revision }}
          GAIA_RECEIPT_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-receipt.json
          GAIA_OBSERVATION_PATH: ${{ github.event_name != 'issues' && !inputs.one_canary && format('{0}/gaia-hosted-draft-pump-observation.json', runner.temp) || '' }}
          GAIA_ERROR_PATH: ${{ runner.temp }}/gaia-hosted-draft-intake-error.json
        run: |
          & node scripts/hosted-draft-pump.mjs intake `
            --repository $env:GITHUB_REPOSITORY `
            --pump-actor-id $env:GAIA_PUMP_ACTOR_ID `
            --repository-node-id $env:GAIA_REPOSITORY_NODE_ID `
            --ledger-root-oid $env:GAIA_LEDGER_ROOT_OID `
            --ledger-root-revision $env:GAIA_LEDGER_ROOT_REVISION `
            --run-id $env:GITHUB_RUN_ID `
            1> $env:GAIA_RECEIPT_PATH 2> $env:GAIA_ERROR_PATH
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Move-Item -LiteralPath $env:GAIA_ERROR_PATH -Destination $env:GAIA_RECEIPT_PATH -Force
            exit $exitCode
          }

      - name: Upload the closed intake receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-hosted-draft-intake-receipt
          path: ${{ runner.temp }}/gaia-hosted-draft-intake-receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      # A typed observation refusal is a legitimate outcome, already named in the receipt above,
      # and an issue lane is given no observation path at all, so an absent document is `warn`
      # rather than `error`. The Control Room reads the absence as a reading that aged out, which
      # is the honest reading of a run that could not say what the pump did — or, for a lane, one
      # that could not be ordered against the others and declined to claim otherwise.
      - name: Upload the verified pump observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-hosted-draft-pump-observation
          path: ${{ runner.temp }}/gaia-hosted-draft-pump-observation.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: false
