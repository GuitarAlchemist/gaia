name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture drift
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: npm run architecture:verify
        env:
          GAIA_ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha }}

  supported:
    name: supported (windows-latest, current Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: node --version
      - run: node --test

  # DISCOVERY, not a gate. The supported host remains Windows. A job named
  # `discovery` that fails the workflow exactly as the
  # `supported` job does is a hard merge gate on an unmeasured platform, and its name
  # would be claiming something its contract does not. `continue-on-error` makes the
  # two agree: the result is reported and read, and it does not block.
  #
  # The POSIX data-directory branch (`defaultDataDir()` under XDG_DATA_HOME) and the
  # spoofed-`$HOME` config tests are portable and pass locally, so Linux is plausibly
  # green. Keep the current portability result observable without changing its
  # advisory support status in this runtime-version update.
  portability-discovery:
    name: discovery (ubuntu-latest, current Node)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: node --test
